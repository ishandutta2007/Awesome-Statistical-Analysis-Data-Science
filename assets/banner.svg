<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b19" />
      <stop offset="45%" stop-color="#0d1527" />
      <stop offset="100%" stop-color="#050814" />
    </linearGradient>

    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="curveGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="curveGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.7" />
      <stop offset="50%" stop-color="#ec4899" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.7" />
    </linearGradient>

    <linearGradient id="areaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.0" />
    </linearGradient>

    <linearGradient id="barGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#1e3a8a" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="barGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#4c1d95" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <!-- Filters & Glows -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.5" stroke-opacity="0.3" />
      <circle cx="40" cy="40" r="1" fill="#64748b" fill-opacity="0.3" />
    </pattern>

    <style>
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-8px) rotate(1deg); }
      }
      @keyframes floatReverse {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(7px) rotate(-1deg); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.7; transform: scale(1.08); }
      }
      @keyframes dashWave {
        0% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: -200; }
      }
      @keyframes barPulse {
        0%, 100% { transform: scaleY(1); }
        50% { transform: scaleY(1.15); }
      }
      @keyframes nodeFlicker {
        0%, 100% { r: 3.5; opacity: 0.6; }
        50% { r: 5.5; opacity: 1; }
      }

      .chart-wave {
        stroke-dasharray: 8 6;
        animation: dashWave 25s linear infinite;
      }
      .chart-wave-solid {
        stroke-dasharray: 600;
        animation: dashWave 40s linear infinite;
      }
      .floating-pill {
        animation: floatSlow 6s ease-in-out infinite;
      }
      .floating-pill-alt {
        animation: floatReverse 7s ease-in-out infinite;
      }
      .glow-orb {
        animation: pulseGlow 8s ease-in-out infinite;
        transform-origin: center;
      }
      .stat-bar {
        transform-origin: bottom;
        animation: barPulse 5s ease-in-out infinite;
      }
      .anim-node {
        animation: nodeFlicker 3s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" />

  <!-- Ambient Glowing Orbs in Background -->
  <circle cx="200" cy="100" r="180" fill="#38bdf8" opacity="0.08" class="glow-orb" />
  <circle cx="1020" cy="320" r="220" fill="#a855f7" opacity="0.09" class="glow-orb" style="animation-delay: -3s;" />
  <circle cx="600" cy="380" r="140" fill="#3b82f6" opacity="0.07" class="glow-orb" style="animation-delay: -5s;" />

  <!-- Subtle Coordinate Grid -->
  <rect width="1200" height="420" fill="url(#grid)" />

  <!-- LAYER: BACKGROUND DYNAMIC GRAPHS & FLOWS -->

  <!-- Histogram / Frequency Distribution Bars (Bottom Background) -->
  <g opacity="0.45" transform="translate(140, 20)">
    <rect class="stat-bar" x="40" y="310" width="18" height="45" rx="3" fill="url(#barGrad1)" style="animation-delay: 0.2s;" />
    <rect class="stat-bar" x="65" y="290" width="18" height="65" rx="3" fill="url(#barGrad1)" style="animation-delay: 0.5s;" />
    <rect class="stat-bar" x="90" y="260" width="18" height="95" rx="3" fill="url(#barGrad1)" style="animation-delay: 0.9s;" />
    <rect class="stat-bar" x="115" y="225" width="18" height="130" rx="3" fill="url(#barGrad1)" style="animation-delay: 0.3s;" />
    <rect class="stat-bar" x="140" y="195" width="18" height="160" rx="3" fill="url(#barGrad2)" style="animation-delay: 0.7s;" />
    <rect class="stat-bar" x="165" y="170" width="18" height="185" rx="3" fill="url(#barGrad2)" style="animation-delay: 0.1s;" />
    <rect class="stat-bar" x="190" y="150" width="18" height="205" rx="3" fill="url(#barGrad2)" style="animation-delay: 0.6s;" />
    <rect class="stat-bar" x="215" y="170" width="18" height="185" rx="3" fill="url(#barGrad2)" style="animation-delay: 0.4s;" />
    <rect class="stat-bar" x="240" y="200" width="18" height="155" rx="3" fill="url(#barGrad1)" style="animation-delay: 0.8s;" />
    <rect class="stat-bar" x="265" y="235" width="18" height="120" rx="3" fill="url(#barGrad1)" style="animation-delay: 0.2s;" />
    <rect class="stat-bar" x="290" y="270" width="18" height="85" rx="3" fill="url(#barGrad1)" style="animation-delay: 0.7s;" />
    <rect class="stat-bar" x="315" y="300" width="18" height="55" rx="3" fill="url(#barGrad1)" style="animation-delay: 0.4s;" />
    <rect class="stat-bar" x="340" y="325" width="18" height="30" rx="3" fill="url(#barGrad1)" style="animation-delay: 0.1s;" />
  </g>

  <!-- Right Chart Grid Elements -->
  <g opacity="0.35" transform="translate(620, 20)">
    <rect class="stat-bar" x="160" y="280" width="16" height="75" rx="3" fill="url(#barGrad2)" style="animation-delay: 0.3s;" />
    <rect class="stat-bar" x="185" y="240" width="16" height="115" rx="3" fill="url(#barGrad2)" style="animation-delay: 0.8s;" />
    <rect class="stat-bar" x="210" y="210" width="16" height="145" rx="3" fill="url(#barGrad2)" style="animation-delay: 0.2s;" />
    <rect class="stat-bar" x="235" y="175" width="16" height="180" rx="3" fill="url(#barGrad1)" style="animation-delay: 0.5s;" />
    <rect class="stat-bar" x="260" y="150" width="16" height="205" rx="3" fill="url(#barGrad1)" style="animation-delay: 0.9s;" />
    <rect class="stat-bar" x="285" y="180" width="16" height="175" rx="3" fill="url(#barGrad1)" style="animation-delay: 0.4s;" />
    <rect class="stat-bar" x="310" y="220" width="16" height="135" rx="3" fill="url(#barGrad2)" style="animation-delay: 0.1s;" />
    <rect class="stat-bar" x="335" y="260" width="16" height="95" rx="3" fill="url(#barGrad2)" style="animation-delay: 0.6s;" />
    <rect class="stat-bar" x="360" y="295" width="16" height="60" rx="3" fill="url(#barGrad2)" style="animation-delay: 0.3s;" />
  </g>

  <!-- Shaded Area Under Curve (Gaussian / Regression) -->
  <path d="M 50 370 Q 200 370, 300 320 T 550 250 T 800 290 T 1050 210 T 1160 230 L 1160 370 L 50 370 Z" fill="url(#areaGrad)" />

  <!-- Dynamic Curved Lines (Sine, Trendlines, Bayesian Posteriors) -->
  <path class="chart-wave" d="M 40 340 C 220 340, 320 220, 520 270 S 780 340, 950 210 S 1120 180, 1170 200" fill="none" stroke="url(#curveGrad1)" stroke-width="3" filter="url(#glow)" />
  <path class="chart-wave-solid" d="M 30 310 C 200 240, 350 360, 580 230 S 820 180, 1000 260 S 1120 220, 1170 240" fill="none" stroke="url(#curveGrad2)" stroke-width="2.5" opacity="0.85" />
  <path d="M 40 375 L 1160 375" stroke="#334155" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.6" />

  <!-- Data Flow / Scatter Points with Connecting Vectors -->
  <g opacity="0.75">
    <line x1="160" y1="120" x2="240" y2="90" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.5" />
    <line x1="240" y1="90" x2="310" y2="130" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.5" />
    <line x1="310" y1="130" x2="390" y2="80" stroke="#818cf8" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.5" />
    
    <circle cx="160" cy="120" r="4" fill="#38bdf8" class="anim-node" />
    <circle cx="240" cy="90" r="5" fill="#818cf8" class="anim-node" style="animation-delay: -1s;" />
    <circle cx="310" cy="130" r="4.5" fill="#c084fc" class="anim-node" style="animation-delay: -2s;" />
    <circle cx="390" cy="80" r="5.5" fill="#38bdf8" class="anim-node" style="animation-delay: -1.5s;" />

    <line x1="880" y1="110" x2="960" y2="70" stroke="#c084fc" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.5" />
    <line x1="960" y1="70" x2="1040" y2="120" stroke="#f43f5e" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.5" />
    <line x1="1040" y1="120" x2="1110" y2="85" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.5" />

    <circle cx="880" cy="110" r="4.5" fill="#c084fc" class="anim-node" style="animation-delay: -0.5s;" />
    <circle cx="960" cy="70" r="5" fill="#f43f5e" class="anim-node" style="animation-delay: -2.2s;" />
    <circle cx="1040" cy="120" r="4" fill="#38bdf8" class="anim-node" style="animation-delay: -1.2s;" />
    <circle cx="1110" cy="85" r="5" fill="#818cf8" class="anim-node" style="animation-delay: -0.8s;" />
  </g>

  <!-- Math & Statistical Symbols (Faint Ambient Notation in Background) -->
  <g font-family="Courier New, monospace" font-size="20" font-weight="bold" fill="#64748b" opacity="0.22">
    <text x="80" y="85">∫ f(x)dx</text>
    <text x="960" y="95">P(A|B) = P(B|A)P(A)/P(B)</text>
    <text x="70" y="220">σ = √(Var(X))</text>
    <text x="1040" y="220">y = Xβ + ε</text>
    <text x="540" y="65">H₀ : μ₁ = μ₂</text>
    <text x="680" y="65">R² = 0.984</text>
  </g>

  <!-- Floating Dynamic Tech Tags / Badges (Placed left & right, away from central titles) -->
  <!-- Left Side Badges -->
  <g class="floating-pill" transform="translate(60, 115)">
    <rect width="130" height="34" rx="17" fill="url(#badgeGrad)" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.5" filter="url(#glow)" />
    <circle cx="20" cy="17" r="5" fill="#38bdf8" />
    <text x="34" y="22" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" letter-spacing="0.5">R &amp; Python</text>
  </g>

  <g class="floating-pill-alt" transform="translate(50, 245)">
    <rect width="145" height="34" rx="17" fill="url(#badgeGrad)" stroke="#818cf8" stroke-width="1" stroke-opacity="0.5" />
    <circle cx="20" cy="17" r="5" fill="#818cf8" />
    <text x="34" y="22" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" letter-spacing="0.5">Bayesian / MCMC</text>
  </g>

  <!-- Right Side Badges -->
  <g class="floating-pill" transform="translate(1010, 125)" style="animation-delay: -2.5s;">
    <rect width="135" height="34" rx="17" fill="url(#badgeGrad)" stroke="#c084fc" stroke-width="1" stroke-opacity="0.5" filter="url(#glow)" />
    <circle cx="20" cy="17" r="5" fill="#c084fc" />
    <text x="34" y="22" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" letter-spacing="0.5">ML &amp; MLOps</text>
  </g>

  <g class="floating-pill-alt" transform="translate(995, 255)" style="animation-delay: -3.5s;">
    <rect width="150" height="34" rx="17" fill="url(#badgeGrad)" stroke="#34d399" stroke-width="1" stroke-opacity="0.5" />
    <circle cx="20" cy="17" r="5" fill="#34d399" />
    <text x="34" y="22" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" letter-spacing="0.5">SAS • SPSS • Julia</text>
  </g>

  <!-- FOREGROUND LAYER: CLEAR, HIGH-CONTRAST TITLES AND SUBTITLES -->
  <!-- Dark vignette backing behind text to guarantee readability over all background waves -->
  <radialGradient id="centerBackdrop" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#0b1120" stop-opacity="0.94" />
    <stop offset="65%" stop-color="#0b1120" stop-opacity="0.8" />
    <stop offset="100%" stop-color="#0b1120" stop-opacity="0" />
  </radialGradient>
  <ellipse cx="600" cy="205" rx="440" ry="145" fill="url(#centerBackdrop)" />

  <g text-anchor="middle">
    <!-- Top Pill Category Header -->
    <g transform="translate(600, 105)">
      <rect x="-165" y="-16" width="330" height="32" rx="16" fill="#1e293b" fill-opacity="0.95" stroke="#475569" stroke-width="1" />
      <text y="5" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="2">CURATED ARCHITECTURE &amp; SUITE GUIDE</text>
    </g>

    <!-- Main Title -->
    <text x="600" y="180" fill="url(#primaryGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif" font-size="44" font-weight="900" letter-spacing="-0.5" filter="url(#softGlow)">Awesome Statistical Analysis &amp; Data Science</text>

    <!-- Subtitle Line 1 -->
    <text x="600" y="228" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="600" letter-spacing="0.2">
      Enterprise Platforms • Statistical Computing • Bayesian Inference • Modern MLOps
    </text>

    <!-- Subtitle Line 2 / Feature highlights -->
    <text x="600" y="260" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="400" letter-spacing="0.4">
      Comparing SaaS &amp; Cloud Hyperscalers with High-Performance Open Source Toolkits
    </text>

    <!-- Bottom Feature Pills -->
    <g transform="translate(600, 310)">
      <!-- Pill 1 -->
      <g transform="translate(-250, 0)">
        <rect x="-65" y="-14" width="130" height="28" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1" />
        <text y="5" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="500">📊 Market Benchmarks</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(-80, 0)">
        <rect x="-65" y="-14" width="130" height="28" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1" />
        <text y="5" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="500">⚖️ Feature Matrix</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(85, 0)">
        <rect x="-65" y="-14" width="130" height="28" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1" />
        <text y="5" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="500">🏢 SaaS / Enterprise</text>
      </g>
      <!-- Pill 4 -->
      <g transform="translate(250, 0)">
        <rect x="-65" y="-14" width="130" height="28" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1" />
        <text y="5" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="500">⚡ Open-Source Suites</text>
      </g>
    </g>
  </g>

  <!-- Outer Border Frame -->
  <rect x="1" y="1" width="1198" height="418" rx="15" fill="none" stroke="#334155" stroke-width="1.5" stroke-opacity="0.6" />
</svg>
